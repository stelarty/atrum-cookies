<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cookie Banner Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Onest', sans-serif;
      background-color: #f1f1f3;
      overflow-x: hidden;
    }
    .bg {
      display: block;
      width: 1366px;
      height: auto;
      margin: 0 auto;
      animation: bgFadeIn 0.9s ease both;
    }
    @keyframes bgFadeIn {
      from { opacity: 0; transform: translateY(16px); filter: blur(12px); }
      to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
    }
  </style>
</head>
<body>
  <img class="bg" src="/bg.png" alt="" width="1366" height="967" />
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
